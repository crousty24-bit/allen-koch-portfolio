name: Update hero stats

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-hero-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update generated hero stats
        run: npm run stats:update
        env:
          GH_PROFILE_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          GITHUB_LOGIN: crousty24-bit

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Biome check
        run: npm run biome:check

      - name: Commit updated stats
        run: |
          if git diff --quiet -- src/data/hero/githubStats.ts; then
            echo "Hero stats unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/hero/githubStats.ts
          git commit -m "chore: update hero stats"
          git push
