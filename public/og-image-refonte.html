<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allen Koch — Image sociale</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      * { box-sizing: border-box; }
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 64px 72px 56px;
        display: flex;
        flex-direction: column;
        background: #f8f7f3;
        color: #191919;
        font-family: 'Schibsted Grotesk', sans-serif;
      }
      .mark {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        background: #191919;
        color: #f8f7f3;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 24px;
      }
      h1 {
        margin: auto 0 32px;
        font-size: 184px;
        font-weight: 500;
        letter-spacing: -0.065em;
        line-height: 1.05;
      }
      .footer {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding-top: 28px;
        border-top: 2px solid #191919;
      }
      .role { margin: 0; font-size: 40px; white-space: nowrap; }
      .location { color: #66645f; }
      .site {
        margin: 0;
        font: 500 22px 'IBM Plex Mono', monospace;
        letter-spacing: 0.06em;
      }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">AK</div>
    <h1>ALLEN KOCH</h1>
    <div class="footer">
      <p class="role">Développeur Fullstack &amp; IA <span class="location">/ Alsace, France</span></p>
      <p class="site">ALLENKOCH.DEV</p>
    </div>
  </body>
</html>
